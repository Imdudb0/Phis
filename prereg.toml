# Phisharp — pré-enregistrement. Daté AVANT les essais.
# Toute modification change l'empreinte du pré-enregistrement, qui est
# reportée dans chaque rapport. Un seuil changé après coup est une déviation.
date = "2026-11-25"

[effectifs]
n_calib = 24
n_ood = 16
n_dict = 12
probes = 8

[etalonnage]
# Si la cause copie bat la cause retrouvée plus souvent que ceci, A est illisible.
copy_win_max = 0.05
# Corrélation de rang phi vs qualite de cause, minimale.
spearman_min = 0.30
# phi sur octets aleatoires / phi sur PTGRS, maximal.
random_phi_ratio_max = 0.60
mip_sweep = "2,6,12"

[ablations]
# A a budget nul doit etre au plancher : sinon la reponse n'a pas ete trouvee.
budget0_a_max = 0.15
# Couper le budget ou la refutation doit degrader A d'au moins ceci.
ablation_drop_min = 0.10
# Ajouter ce que le residu designe doit faire monter phi d'au moins ceci,
# et davantage qu'un span aleatoire de meme longueur.
residue_gain_min = 0.0

[B]
# Rang fractionnaire -> MRR. Seuil de reussite de B.
b_mrr_min = 0.45
# Marge sur les deux baselines, armes egales.
b_margin_min = 0.10
# Effondrement sous permutation des corps de definition.
shuffle_collapse_min = 0.15

[verdict]
a_min = 0.35