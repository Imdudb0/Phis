[package]
name = "phisharp"
version = "0.1.0"
edition = "2024"
description = "A general model of abduction-based understanding on a non-reciprocal connectionist substrate"

[lib]
name = "phisharp"
path = "src/lib.rs"

[[bin]]
name = "phisharp"
path = "src/main.rs"

[[bin]]
name = "verify"
path = "src/bin/verify.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1