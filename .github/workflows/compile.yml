name: Run Phis

on:
  workflow_dispatch

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  RAYON_NUM_THREADS: "4"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: cargo build --release --bins
        env:
          RUSTFLAGS: "-C target-cpu=native"

      - name: Run Phisharp
        run: |
          #cargo check
          #cargo run --release -- train --out out/sharp.phis --steps 300 > out/out.txt 2>&1
          #cargo run --release -- ask --model out/sharp.phis --file out/mh.eff
          #cargo run --release -- ask --model out/sharp.phis --file out/mh_flat.eff
          sed -i 's/pqrsrqpqrsrqpqrsrqpqrsrqp/pqrsrqppqrsrqppqrsrqppqrsrqp/' out/defs_fr.eff
carg
          cargo run --release -- ask --model out/sharp.phis --file out/defs_fr.eff
          cp out/defs_fr.eff out/defs_hop3.eff
          printf 'vwxwmvwxwqvwxwtvwxwavwxwbvwxw' >> out/defs_hop3.eff
# (si defs_fr.eff finissait par \n, recolle sur la dernière ligne)
          tr -d '\n' < /dev/null >/dev/null && python3 -c "s=open('out/defs_fr.eff').read().rstrip('\n')+'vwxwmvwxwqvwxwtvwxwavwxwbvwxw\n'; open('out/defs_hop3.eff','w').write(s)"
          cargo run --release -- ask --model out/sharp.phis --file out/defs_hop3.eff


          #cargo run --release -- sample --out out/mh_flat.eff --family multihop_flat --seed 23 > out/eval.txt 2>&1
          #tr -d '\n' < molds.eff > out/molds_flat.eff
          cargo run --release -- ask --model out/sharp.phis --file out/defs_fr.eff > out/ask.txt 2>&1
        env:
          RUSTFLAGS: "-C target-cpu=native"

      - name: Run test
        run: |
          cargo test 
#--workspace
          #cargo clippy --workspace --all-targets

      - name: Debug - Show files and Git status
        if: always()
        run: |
          echo "=== Files in directories ==="
          ls -la out/ || echo "Directory out/ not found!"
          echo "=== Git Status (including ignored) ==="
          git status --ignored

      - name: Commit and Push changes
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Résultats simulation: ${{ github.run_number }}"
          file_pattern: 'out/'
          add_options: '-f'