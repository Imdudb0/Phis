name: Run Phis

on:
  workflow_dispatch

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  RAYON_NUM_THREADS: "4"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: cargo build --release --bins
        env:
          RUSTFLAGS: "-C target-cpu=native"

      - name: Run Phisharp
        run: |
          cargo run --release -- grad-check --seed 42
          #cargo check
          #cargo run --release -- train --out out/sharp.phis --steps 300 --seed 42 > out/out.txt 2>&1
          #cargo run --release -- train --out out/sharp_step0.phis --objective untrained --seed 42
          #cargo run --release -- train --out out/sharp_ll.phis    --objective ll  --steps 300 --seed 42
          #cargo run --release -- train --out out/sharp_mdl.phis   --objective mdl --steps 300 --seed 42
          #cargo run --release -- compare \
            #--untrained out/sharp_step0.phis \
            #--ll        out/sharp_ll.phis \
            #--mdl       out/sharp_mdl.phis \
            #--phi       out/sharp.phis
          cargo run --release -- compare-all --dir out --steps 120 --seed 42
          #cargo run --release -- calibrate --model out/sharp.phis --seed 101
          #cargo run --release -- eval-ood --model out/sharp.phis --seed 202
          #cargo run --release -- eval-transfer --model out/sharp.phis --seed 303
          #cargo run --release -- ask --model out/sharp.phis --file out/defs_hop3.eff
          #cargo run --release -- ask --model out/sharp.phis --file out/comp.eff

          #cargo run --release -- ask --model out/sharp.phis --file out/defs_fr.eff > out/ask.txt 2>&1
        env:
          RUSTFLAGS: "-C target-cpu=native"

      - name: Run test
        run: |
          cargo test 
#--workspace
          #cargo clippy --workspace --all-targets

      - name: Debug - Show files and Git status
        if: always()
        run: |
          echo "=== Files in directories ==="
          ls -la out/ || echo "Directory out/ not found!"
          echo "=== Git Status (including ignored) ==="
          git status --ignored

      - name: Commit and Push changes
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Résultats simulation: ${{ github.run_number }}"
          file_pattern: 'out/'
          add_options: '-f'