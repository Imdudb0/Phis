name: phisharp

on:
  push:
  workflow_dispatch:

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  phisharp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: deps
        run: pip install "numpy>=1.24"

      - name: verrous structurels (doivent passer)
        run: python phisharp.py selftest

      - name: une seance d'entrainement
        run: |
          python phisharp.py train \
            --out out/sharp.phis --profile ci \
            --episodes 2000 --seed 0 --max-seconds 900

      - name: evaluation zero-shot (grammaires jamais vues)
        run: python phisharp.py eval --model out/sharp.phis --episodes 24 --seed 0

      - name: perception de demonstration
        run: python phisharp.py demo --out perceived.eff

      - name: ask
        run: python phisharp.py ask --model out/sharp.phis --file perceived.eff

      - uses: actions/upload-artifact@v4
        with:
          name: phisharp-out
          path: |
            out/
            perceived.eff